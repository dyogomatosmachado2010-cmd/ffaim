name: build-ffaim

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache Theos
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-linux-v1

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip unzip \
            git libxml2-dev xz-utils dpkg-dev libtinfo6 ldid

      - name: Instalar Theos (Linux)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          ls "$HOME/theos/toolchain/linux/iphone/bin/clang"
          ls "$HOME/theos/sdks" | head -3

      - name: Ambiente
        run: |
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          export THEOS="$HOME/theos"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -1
          ls "$THEOS/sdks" | head -3
          ls -la "$THEOS/lib/libsubstrate.dylib"

      - name: Build .deb (jailbreak)
        run: |
          cd cheat
          make clean package
          ls -la packages/

      - name: Build ffaim.dylib (sem jailbreak)
        run: |
          cd cheat
          chmod +x build_dylib.sh
          ./build_dylib.sh
          ls -la ffaim.dylib libsubstrate.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: ffaim-build
          if-no-files-found: error
          path: |
            cheat/packages/*.deb
            cheat/ffaim.dylib
            cheat/libsubstrate.dylib
