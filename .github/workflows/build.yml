name: build-ffaim

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache Theos
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-linux-v1

      - name: Dependencias
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl zip unzip \
            git xz-utils dpkg-dev libtinfo6 || true
          sudo apt-get install -y libxml2-dev || echo "aviso: libxml2-dev"
          sudo apt-get install -y ldid || echo "aviso: ldid (o toolchain traz o dele)"
          command -v make && command -v dpkg-deb && echo deps-ok

      - name: Instalar Theos (Linux)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          ls "$HOME/theos/toolchain/linux/iphone/bin/clang"

      - name: Ambiente
        run: |
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          export THEOS="$HOME/theos"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -1 || true
          echo "--- sdks ---"
          ls "$THEOS/sdks" || true
          echo "--- ld64 ---"
          ls -la "$THEOS/toolchain/linux/iphone/bin/ld64" || echo "sem ld64 explicito"

      - name: Build .deb (jailbreak)
        id: deb
        run: |
          cd cheat
          set -o pipefail
          make clean package 2>&1 | tee ../deb.log

      - name: Build ffaim.dylib (sem jailbreak)
        id: dylib
        if: always()
        run: |
          cd cheat
          set -o pipefail
          chmod +x build_dylib.sh
          ./build_dylib.sh 2>&1 | tee ../dylib.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ffaim-build
          if-no-files-found: warn
          path: |
            deb.log
            dylib.log
            cheat/packages/*.deb
            cheat/ffaim.dylib

      # publica os logs num branch pra poder ler sem token
      - name: Publicar log
        if: always()
        run: |
          mkdir -p ci-logs
          cp deb.log ci-logs/ 2>/dev/null || true
          cp dylib.log ci-logs/ 2>/dev/null || true
          git config user.name "ci"
          git config user.email "ci@local"
          git add -f ci-logs
          git commit -m "ci: log run $GITHUB_RUN_NUMBER [skip ci]" || true
          git push origin HEAD:refs/heads/ci-log --force || true

      - name: Falhou?
        if: always() && (steps.deb.outcome != 'success' || steps.dylib.outcome != 'success')
        run: |
          echo "deb=${{ steps.deb.outcome }} dylib=${{ steps.dylib.outcome }}"
          exit 1
